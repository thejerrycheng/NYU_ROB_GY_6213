# lidar_config.yaml
# Simple, unbiased 2-D LiDAR noise model.
# All noise is zero-mean Gaussian — no incidence scaling, no mixed-pixel.

geometry:
  num_rays: 360
  fov_deg: 360.0
  start_angle_deg: 0.0
  min_range: 0.15 # blind zone [m]
  max_range: 5.0

# Additive Gaussian range noise — zero mean, symmetric
# sigma_range: std-dev of range error [m]
# range_dependent: noise grows slightly with distance
# range_noise_k: extra fraction per metre (2% -> 1cm extra at 5m)
gaussian_noise:
  enabled: true
  sigma_range: 0.020 # 2 cm std-dev at r=0
  range_dependent: true
  range_noise_k: 0.02

# Per-beam angular jitter — models encoder/bearing error
angular_noise:
  enabled: true
  sigma_angle_deg: 0.20 # 0.2 deg std-dev

# Short outliers — spurious near returns (glass, dust, cross-talk)
# Drawn uniformly in [short_min_frac * true_range, true_range]
outliers:
  enabled: true
  short_prob: 0.008 # ~3 short outliers per 360-beam scan
  short_min_frac: 0.10 # at least 10% of true range

# Dropouts — complete loss of return -> max_range
# Models dark/transparent surfaces
dropout:
  enabled: true
  prob: 0.003 # ~1 dropout per 360-beam scan

scan_rate_hz: 10.0

# MuJoCo viewer — red dots only
visualization:
  enabled: true
  beam_height: 0.15 # Z above floor [m]  (above chassis/walls)
  hit_radius: 0.04 # sphere radius [m]  (visible from 4m camera)
  max_vis_beams: 360
