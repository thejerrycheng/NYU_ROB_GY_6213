# ══════════════════════════════════════════════════════════════════════════════
# lidar_config.yaml — 2D LiDAR simulation parameters
#
# Modelled after common indoor 2D lidars (RPLidar A2 / Hokuyo UTM-30LX).
# All units: metres, radians, seconds unless noted.
# ══════════════════════════════════════════════════════════════════════════════

# ── Geometry ──────────────────────────────────────────────────────────────────
geometry:
  num_rays:       360        # number of beams per scan (angular resolution)
  fov_deg:        360.0      # total field of view [degrees]  (360 = full scan)
  start_angle_deg: 0.0       # angle of first ray relative to robot heading [deg]
  min_range:      0.15       # minimum valid range [m]  (blind zone around sensor)
  max_range:      5.0        # maximum sensing distance [m]

# ── Gaussian range noise (additive, per-beam) ─────────────────────────────────
# Models sensor electronics noise and surface reflectivity variation.
# sigma_range is the std-dev of range error for a perpendicular surface.
# At grazing angles the effective noise grows (modelled via incidence scaling).
gaussian_noise:
  enabled:        true
  sigma_range:    0.015      # [m]  std-dev of range noise (RPLidar A2 ≈ 0.01–0.02)
  range_dependent: true      # noise grows with distance: σ_eff = σ * (1 + k*r)
  range_noise_k:  0.02       # distance scaling factor (2% extra σ per metre)

# ── Beam divergence / angular resolution uncertainty ─────────────────────────
# Real beams have a finite width (typically 0.1°–0.5°).
# Modelled as angular jitter added to each ray direction each scan.
angular_noise:
  enabled:        true
  sigma_angle_deg: 0.1       # [deg]  std-dev of per-beam angle jitter

# ── Outliers ──────────────────────────────────────────────────────────────────
# Two types of outliers observed in real 2D lidars:
#
#   short_outlier  — spurious short returns (glass, dust, cross-talk).
#                    Drawn uniformly in [min_range, true_range].
#   long_outlier   — missed detections returning max_range or beyond.
#                    These are clamped to max_range.
outliers:
  enabled:        true

  # Short (phantom) returns
  short_prob:     0.005      # probability per beam of a short outlier
  short_min_frac: 0.1        # minimum fraction of true range (e.g. 0.1 → 10%)

  # Long (missed detection) returns → returned as max_range
  long_prob:      0.003      # probability per beam of a missed detection

# ── Rayleigh / mixed-pixel effect ─────────────────────────────────────────────
# At range discontinuities the beam partially hits two surfaces.
# Modelled as a small fraction of beams near a jump receiving a blended range.
mixed_pixel:
  enabled:        true
  jump_threshold: 0.20       # range jump [m] that triggers mixed-pixel check
  blend_fraction: 0.3        # how often a mixed-pixel event occurs at a jump (0-1)

# ── Beam drop-out (missing returns) ───────────────────────────────────────────
# Beams hitting transparent or highly absorptive surfaces return nothing.
# These are reported at max_range (same as "no return").
dropout:
  enabled:        true
  prob:           0.002      # probability per beam of a complete dropout

# ── Sensor update rate ────────────────────────────────────────────────────────
scan_rate_hz:     10.0       # scans per second (used for timing in sim loop)

# ── Visualisation (MuJoCo user_scn) ──────────────────────────────────────────
visualization:
  enabled:        true
  beam_rgba:      [0.0, 0.9, 0.9, 0.35]   # cyan beams, semi-transparent
  hit_rgba:       [1.0, 0.2, 0.1, 0.90]   # red hit-point spheres
  miss_rgba:      [0.5, 0.5, 0.5, 0.10]   # grey for max-range (no-hit) beams
  outlier_rgba:   [1.0, 0.6, 0.0, 0.95]   # orange for outlier points
  beam_radius:    0.003      # capsule radius for beam lines [m]
  hit_radius:     0.012      # sphere radius for hit points [m]
  beam_height:    0.075      # Z height of scan plane above floor [m]
  show_beams:     true       # draw beam lines (can disable for perf)
  show_hits:      true       # draw hit-point spheres
  show_misses:    false      # draw no-hit (max-range) endpoints
  max_vis_beams:  360        # cap rendered beams for performance
